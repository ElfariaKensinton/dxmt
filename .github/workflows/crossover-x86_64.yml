name: Build CrossOver x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: llvmorg-15.0.7
  WINE_VERSION: v8.16-3shain
  WINE_URL: https://github.com/3Shain/wine/releases/download/v8.16-3shain/wine.tar.gz
  LLVM_MINGW_VERSION: "20260908"
  LLVM_MINGW_DIR: llvm-mingw-20260908-ucrt-macos-universal

jobs:
  setup-wine:
    name: Prepare Wine toolchain
    runs-on: macos-15
    steps:
      - name: Check Wine cache
        id: cache-wine
        uses: actions/cache@v5
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}-macos
          restore-keys: |
            wine-x86_64-${{ env.WINE_VERSION }}-
          lookup-only: true
          path: ./toolchains/wine

      - name: Download Wine
        if: steps.cache-wine.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/wine
          curl -fL "${WINE_URL}" -o ./wine.tar.gz
          tar -zxf ./wine.tar.gz -C ./toolchains/wine

      - name: Save Wine cache
        if: steps.cache-wine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}-macos
          path: ./toolchains/wine

  setup-llvm-mingw:
    name: Prepare LLVM-MinGW
    runs-on: macos-15
    steps:
      - name: Check LLVM-MinGW cache
        id: cache-llvm-mingw
        uses: actions/cache@v5
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos
          restore-keys: |
            llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-
          lookup-only: true
          path: ./toolchains/${{ env.LLVM_MINGW_DIR }}

      - name: Download LLVM-MinGW
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains
          curl -fL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_DIR}.tar.xz" -o ./llvm.tar.xz
          tar -xf ./llvm.tar.xz -C ./toolchains

      - name: Save LLVM-MinGW cache
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos
          path: ./toolchains/${{ env.LLVM_MINGW_DIR }}

  setup-llvm-project:
    name: Prepare LLVM source
    runs-on: macos-15
    steps:
      - name: Check LLVM source cache
        id: cache-llvm-project
        uses: actions/cache@v5
        with:
          key: llvm-project-${{ env.LLVM_VERSION }}-macos
          restore-keys: |
            llvm-project-${{ env.LLVM_VERSION }}-
          lookup-only: true
          path: ./toolchains/llvm-project

      - name: Clone LLVM source
        if: steps.cache-llvm-project.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains
          git clone --depth 1 --branch "${LLVM_VERSION}" https://github.com/llvm/llvm-project.git toolchains/llvm-project

      - name: Save LLVM source cache
        if: steps.cache-llvm-project.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: llvm-project-${{ env.LLVM_VERSION }}-macos
          path: ./toolchains/llvm-project

  setup-llvm-darwin:
    name: Prepare x86_64 Darwin LLVM
    runs-on: macos-15
    needs: setup-llvm-project
    steps:
      - name: Check x86_64 LLVM cache
        id: cache-llvm-darwin
        uses: actions/cache@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-macos
          restore-keys: |
            llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-
          lookup-only: true
          path: ./toolchains/llvm-darwin

      - name: Restore LLVM source
        if: steps.cache-llvm-darwin.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          key: llvm-project-${{ env.LLVM_VERSION }}-macos
          path: ./toolchains/llvm-project

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.1.app

      - name: Build LLVM for Darwin x86_64
        if: steps.cache-llvm-darwin.outputs.cache-hit != 'true'
        run: |
          cmake -B ./toolchains/llvm-darwin-build -S ./toolchains/llvm-project/llvm \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/toolchains/llvm-darwin" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DLLVM_HOST_TRIPLE=x86_64-apple-darwin \
            -DLLVM_ENABLE_ASSERTIONS=On \
            -DLLVM_ENABLE_ZSTD=Off \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-D_LIBCPP_KEEP_TRANSITIVE_INCLUDES_LLVM23" \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_BUILD_TOOLS=Off \
            -DLLVM_INCLUDE_BENCHMARKS=Off \
            -DBUG_REPORT_URL="https://github.com/3Shain/dxmt" \
            -DPACKAGE_VENDOR="DXMT" \
            -DLLVM_VERSION_PRINTER_SHOW_HOST_TARGET_INFO=Off \
            -G Ninja
          cmake --build ./toolchains/llvm-darwin-build
          cmake --install ./toolchains/llvm-darwin-build

      - name: Save x86_64 LLVM cache
        if: steps.cache-llvm-darwin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-macos
          path: ./toolchains/llvm-darwin

  build:
    name: Build DXMT for CrossOver x86_64
    runs-on: macos-15
    needs: [setup-wine, setup-llvm-mingw, setup-llvm-darwin]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Restore Wine cache
        uses: actions/cache/restore@v5
        with:
          key: wine-x86_64-${{ env.WINE_VERSION }}-macos
          path: ./toolchains/wine

      - name: Restore LLVM-MinGW cache
        uses: actions/cache/restore@v5
        with:
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-macos
          path: ./toolchains/${{ env.LLVM_MINGW_DIR }}

      - name: Restore x86_64 LLVM cache
        uses: actions/cache/restore@v5
        with:
          key: llvm-darwin-${{ env.LLVM_VERSION }}-x86_64-macos
          path: ./toolchains/llvm-darwin

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.1.app

      - name: Install Meson
        run: pip3 install meson==1.10.0 --break-system-packages

      - name: Build and install DXMT
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/toolchains/${LLVM_MINGW_DIR}/bin"
          meson setup --cross-file build-win64.txt \
            -Denable_nvapi=true -Denable_nvngx=true -Denable_d3d12=true \
            -Dnative_llvm_path=toolchains/llvm-darwin \
            -Dwine_install_path=toolchains/wine \
            build --buildtype release --prefix "$(pwd)/install" --strip
          meson compile -C build
          meson install -C build

      - name: Upload CrossOver x86_64 build
        uses: actions/upload-artifact@v6
        with:
          name: dxmt-crossover-x86_64-${{ github.sha }}
          path: install
          if-no-files-found: error
          compression-level: 6
